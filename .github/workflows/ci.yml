name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @corridas/api prisma:generate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  observabilidade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: promtool valida a configuração e as regras de alerta
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/observability:/etc/prometheus:ro"
          prom/prometheus:v3.15.1 check config /etc/prometheus/prometheus.yml
      - name: promtool testa as regras com séries simuladas
        run: >-
          docker run --rm --entrypoint promtool
          -v "$PWD/observability:/etc/prometheus:ro"
          prom/prometheus:v3.15.1 test rules /etc/prometheus/alerts.test.yml
      - name: alerts.yml e o PrometheusRule têm os mesmos groups
        run: >-
          diff
          <(yq -o=json '.groups' observability/alerts.yml)
          <(yq -o=json '.spec.groups' observability/alerts-prometheusrule.yaml)

  integracao:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: build das imagens
        run: docker compose build
      - run: docker compose up -d --wait
      - run: pnpm --filter @corridas/api test:api
      - run: pnpm --filter @corridas/worker test:integration
      - run: pnpm --filter @corridas/e2e exec playwright install --with-deps chromium
      - run: pnpm e2e
      - if: failure()
        run: docker compose logs
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-playwright
          path: e2e/playwright-report
          retention-days: 7
