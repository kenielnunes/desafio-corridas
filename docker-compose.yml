name: corridas

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: corridas
      MYSQL_USER: corridas
      MYSQL_PASSWORD: corridas_dev
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_ROOT_HOST: localhost
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP em 127.0.0.1 de propósito: durante o init o mysqld roda sem rede e só responderia pelo socket.
      # Sem credencial: o ping retorna sucesso mesmo com acesso negado, o que basta para saber que o servidor está no ar.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    command: ['redis-server', '--requirepass', 'redis_dev']
    environment:
      REDISCLI_AUTH: redis_dev
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8.0.34
    environment:
      MONGO_INITDB_ROOT_USERNAME: corridas
      MONGO_INITDB_ROOT_PASSWORD: corridas_dev
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # pelo hostname e não por 127.0.0.1: durante o init o mongod temporário só escuta em localhost
      test: ['CMD-SHELL', 'mongosh --quiet --host "$$(hostname)" --eval "db.adminCommand({ping:1}).ok"']
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    # o RabbitMQ guarda os dados por nome de nó, que vem do hostname; fixo, o volume sobrevive ao container
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: corridas
      RABBITMQ_DEFAULT_PASS: corridas_dev
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 10s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '127.0.0.1:9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  mongo-data:
  rabbitmq-data:
