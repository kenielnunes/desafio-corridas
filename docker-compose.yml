name: corridas

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: corridas
      MYSQL_USER: corridas
      MYSQL_PASSWORD: corridas_dev
      MYSQL_ROOT_PASSWORD: root_dev
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP em 127.0.0.1 de propósito: durante o init o mysqld roda sem rede e só responderia pelo socket
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8.0.34
    environment:
      MONGO_INITDB_ROOT_USERNAME: corridas
      MONGO_INITDB_ROOT_PASSWORD: corridas_dev
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # pelo hostname e não por 127.0.0.1: durante o init o mongod temporário só escuta em localhost
      test: ['CMD-SHELL', 'mongosh --quiet --host "$$(hostname)" --eval "db.adminCommand({ping:1}).ok"']
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: corridas
      RABBITMQ_DEFAULT_PASS: corridas_dev
    ports:
      - '127.0.0.1:15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 10s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '127.0.0.1:9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  mongo-data:
