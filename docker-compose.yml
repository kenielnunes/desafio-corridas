name: corridas

services:
  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_DATABASE: corridas
      MYSQL_USER: corridas
      MYSQL_PASSWORD: corridas_dev
      MYSQL_ROOT_PASSWORD: root_dev
      MYSQL_ROOT_HOST: localhost
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP em 127.0.0.1 de propósito: durante o init o mysqld roda sem rede e só responderia pelo socket.
      # Sem credencial: o ping retorna sucesso mesmo com acesso negado, o que basta para saber que o servidor está no ar.
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8.10.3-alpine
    command: ['redis-server', '--requirepass', 'redis_dev']
    environment:
      REDISCLI_AUTH: redis_dev
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8.0.34
    environment:
      MONGO_INITDB_ROOT_USERNAME: corridas
      MONGO_INITDB_ROOT_PASSWORD: corridas_dev
    volumes:
      - mongo-data:/data/db
    ports:
      - '127.0.0.1:${MONGO_PORT:-27017}:27017'
    healthcheck:
      # pelo hostname e não por 127.0.0.1: durante o init o mongod temporário só escuta em localhost
      test:
        ['CMD-SHELL', 'mongosh --quiet --host "$$(hostname)" --eval "db.adminCommand({ping:1}).ok"']
      interval: 5s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine
    # o RabbitMQ guarda os dados por nome de nó, que vem do hostname; fixo, o volume sobrevive ao container
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: corridas
      RABBITMQ_DEFAULT_PASS: corridas_dev
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - '127.0.0.1:15672:15672'
      - '127.0.0.1:${RABBITMQ_PORT:-5672}:5672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 10s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: mysql://corridas:corridas_dev@mysql:3306/corridas
      RABBITMQ_URL: amqp://corridas:corridas_dev@rabbitmq:5672
      REDIS_URL: redis://:redis_dev@redis:6379
      JWT_PUBLIC_KEY_FILE: /run/jwt/public-key.pem
      JWT_ISSUER: corridas-auth-dev
      JWT_AUDIENCE: corridas-api
    volumes:
      - ./auth-dev/public-key.pem:/run/jwt/public-key.pem:ro
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      # o worker declara a fila; sem ela, eventos publicados na primeira subida seriam descartados
      worker:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/health/ready']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WORKER_PORT:-9464}:9464'
    environment:
      RABBITMQ_URL: amqp://corridas:corridas_dev@rabbitmq:5672
      MONGO_URL: mongodb://corridas:corridas_dev@mongo:27017/?authSource=admin
      REDIS_URL: redis://:redis_dev@redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9464/health/ready']
      interval: 5s
      timeout: 3s
      retries: 20

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - '127.0.0.1:${UI_PORT:-8080}:8080'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '127.0.0.1:9090:9090'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
  mongo-data:
  rabbitmq-data:
