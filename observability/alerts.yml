groups:
  - name: corridas
    rules:
      - alert: RidesApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{service="corridas-api", status_code=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{service="corridas-api"}[5m]))
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Mais de 5% das requisições da API estão falhando com erro 5xx.
          description: 'Taxa de erros 5xx em {{ $value | humanizePercentage }} nos últimos 5 minutos.'

      - alert: RidesWorkerQueueBacklog
        expr: max(rabbitmq_detailed_queue_messages_ready{queue="rides.worker"}) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Mensagens acumulando na fila do worker.
          description: '{{ $value }} mensagens esperando há mais de 5 minutos: o worker caiu ou não está dando conta, e o status no cache fica atrasado.'
