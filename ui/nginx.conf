server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # DNS interno do Docker. Com o endereço numa variável, o nginx resolve o nome a cada 10 s em vez
    # de guardar o IP da subida, e o proxy continua funcionando quando o container da API é recriado.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        set $api http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control no-store always;
    }

    location / {
        try_files $uri /index.html;
    }
}
